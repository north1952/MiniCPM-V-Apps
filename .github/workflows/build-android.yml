# ============================================================
# MiniCPM-V-Apps — Android APK 构建 (GitHub Actions)
# 用法：
#   1) 在 GitHub 上 fork OpenBMB/MiniCPM-V-Apps 到你自己的账号
#   2) 在 fork 仓库根目录建 .github/workflows/build-android.yml
#      并把本文件内容粘进去
#   3) push 触发，或在 Actions 面板点 "Run workflow" 手动触发
# 产物：app-debug.apk（debug 签名，可直接安装）
#       app-release-unsigned.apk（不签名，可用任意工具补签）
# 说明：无需任何 secret。build.gradle.kts 已兼容无 keystore 场景。
# ============================================================
name: build-android

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      # 免费 runner 只有 ~14GB 空闲磁盘，而 NDK 27 解压后约 11GB。
      # 清掉镜像里用不到的预装组件（dotnet/mono/powershell/gcloud 等），腾出 4~5GB。
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/lib/mono /usr/local/share/powershell \
                     /opt/google-cloud-sdk /usr/local/heroku /usr/local/rvm
          df -h /

      # .gitmodules 已声明 shallow=true，checkout 会做浅克隆子模块
      - name: Checkout (incl. llama.cpp-omni submodule)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      # AGP 9.1 最低要求 JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # GitHub ubuntu 镜像自带 SDK + cmdline-tools（/usr/local/lib/android/sdk）。
      # 注意：android-actions/setup-android@v3 已失效（会去装被移除的旧版 'tools' 包），
      # 所以这里直接用镜像里的 sdkmanager 装所需组件。
      # compileSdk 是 API 36.1（minorApiLevel=1），36.1 小版本平台由 AGP 构建时自动下载
      - name: Install NDK 27 + CMake 4.1.2 + SDK packages
        run: |
          export ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}
          SDKMGR=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)
          yes | "$SDKMGR" --licenses > /dev/null
          yes | "$SDKMGR" \
            "ndk;27.0.12077973" \
            "cmake;4.1.2" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"
          df -h /

      # 构建。网络依赖：
      #   - Google Maven / Maven Central（Gradle 依赖）
      #   - github.com releases（CMake 配置阶段 FetchContent 拉 KleidiAI v1.24.0）
      # runner 均可直连，无需代理。
      - name: Build APK (debug + release-unsigned)
        working-directory: MiniCPM-V-demo-Android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: minicpm-v-android
          path: |
            MiniCPM-V-demo-Android/app/build/outputs/apk/debug/app-debug.apk
            MiniCPM-V-demo-Android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 30
